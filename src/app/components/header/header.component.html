<!-- src/app/components/header/header.component.html -->
<header
  class="fixed top-0 left-0 w-full z-40 transition-all duration-300 bg-white dark:bg-gray-900"
  [class.scrolled-header]="scrolled"
>
  <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8">
    <nav class="flex items-center justify-between h-16">

      <!-- Logo -->
      <a routerLink="/" class="flex items-center gap-2 group">
        <svg width="28" height="28" viewBox="0 0 24 24" stroke-width="1.5" fill="none" xmlns="http://www.w3.org/2000/svg" class="text-gray-800 dark:text-white group-hover:text-purple-600 transition-colors">
          <path d="M13.5 6L10 18.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M6.5 8.5L3 12L6.5 15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
          <path d="M17.5 8.5L21 12L17.5 15.5" stroke="currentColor" stroke-width="1.5" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span class="font-bold text-lg text-gray-800 dark:text-white group-hover:text-purple-600 transition-colors">Juan Flores</span>
      </a>

      <!-- Desktop nav -->
      <ul class="hidden md:flex items-center gap-1">
        <li>
          <a routerLink="/" routerLinkActive="nav-active" [routerLinkActiveOptions]="{ exact: true }"
            class="nav-link">About me</a>
        </li>
        <li>
          <a routerLink="/projects" routerLinkActive="nav-active"
            class="nav-link">Projects</a>
        </li>
        <li>
          <a routerLink="/contact" routerLinkActive="nav-active"
            class="nav-link">Contact</a>
        </li>
      </ul>

      <!-- Dark mode toggle + hamburger -->
      <div class="flex items-center gap-3">
        <button (click)="toggleDarkMode()" class="toggle-button relative inline-flex items-center cursor-pointer focus:outline-none" aria-label="Toggle dark mode" [attr.aria-pressed]="isDark">
          <div class="relative w-10 h-6 rounded-full border transition-colors overflow-hidden" [class.border-purple-500]="!isDark" [class.border-transparent]="isDark" [class.bg-gray-100]="!isDark" [class.bg-purple-600]="isDark" [class.dark:bg-gray-700]="!isDark">
            <div class="absolute inset-0 flex items-center justify-between px-1 pointer-events-none">
              <svg class="w-3 h-3 text-yellow-400 opacity-95" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M6.76 4.84l-1.8-1.79L3.17 4.84l1.79 1.8 1.8-1.8zM1 13h3v-2H1v2zm10-9h2V1h-2v3zm7.04 2.05l1.79-1.79-1.79-1.79-1.79 1.79 1.79 1.79zM17 13h3v-2h-3v2zM12 7a5 5 0 100 10 5 5 0 000-10zm4.24 8.16l1.8 1.79 1.79-1.79-1.79-1.8-1.8 1.8zM6.76 19.16l-1.79 1.79 1.79 1.79 1.8-1.79-1.8-1.79zM12 23h2v-3h-2v3z"/>
              </svg>
              <svg class="w-3 h-3 text-indigo-300 opacity-70" viewBox="0 0 24 24" fill="currentColor" xmlns="http://www.w3.org/2000/svg" aria-hidden="true">
                <path d="M21 12.79A9 9 0 1111.21 3 7 7 0 0021 12.79z"/>
              </svg>
            </div>
            <div class="dot absolute left-1 top-1/2 -translate-y-1/2 w-4 h-4 rounded-full transform transition-transform shadow-sm z-10 bg-white border border-gray-200 dark:border-gray-700" [class.translate-x-5]="isDark" [class.ring-2]="isDark" [class.ring-purple-500]="isDark" aria-hidden="true"></div>
          </div>
        </button>
        <!-- Hamburger (mobile) -->
        <button (click)="toggleMenu()" class="md:hidden p-2 rounded-lg hover:bg-gray-100 dark:hover:bg-gray-700 transition-colors" aria-label="Toggle menu">
          <svg *ngIf="!menuOpen" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="text-gray-700 dark:text-white" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M4 6h16M4 12h16M4 18h16"/>
          </svg>
          <svg *ngIf="menuOpen" width="22" height="22" fill="none" viewBox="0 0 24 24" stroke="currentColor" class="text-gray-700 dark:text-white" stroke-width="2">
            <path stroke-linecap="round" stroke-linejoin="round" d="M6 18L18 6M6 6l12 12"/>
          </svg>
        </button>
      </div>
    </nav>

    <!-- Mobile menu -->
    <div *ngIf="menuOpen" class="md:hidden pb-3 flex flex-col gap-1 border-t border-gray-100 dark:border-gray-700 mt-1 pt-2">
      <a routerLink="/" routerLinkActive="nav-active-mobile" [routerLinkActiveOptions]="{ exact: true }" (click)="menuOpen=false"
        class="nav-link-mobile">About me</a>
      <a routerLink="/projects" routerLinkActive="nav-active-mobile" (click)="menuOpen=false"
        class="nav-link-mobile">Projects</a>
      <a routerLink="/contact" routerLinkActive="nav-active-mobile" (click)="menuOpen=false"
        class="nav-link-mobile">Contact</a>
    </div>
  </div>
</header>
